<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer Controller</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #222; padding: 20px; border-radius: 15px; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; margin: 20px 0; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .status { padding: 10px; background: #333; border-radius: 5px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: red; }
        .dot.active { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #444; color: white; }
        #btnStart { background: #00b09b; }
        #linkBox { background: #111; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎥 Remote Viewer</h2>
        <div class="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">Menunggu Koneksi...</span>
        </div>

        <div class="controls">
            <button id="btnStart">MULAI VIEWER</button>
            <button id="btnCopy">SALIN LINK</button>
        </div>

        <div id="linkBox" style="display:none"></div>

        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <div id="noSignal" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#555">NO SIGNAL</div>
        </div>
        
        <div style="font-size: 12px; color: #888;">
            ID Anda: <span id="myId">-</span><br>
            Target: <span id="targetId">-</span>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        let peer = null;
        let conn = null;
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const myIdText = document.getElementById('myId');
        const targetIdText = document.getElementById('targetId');
        const linkBox = document.getElementById('linkBox');

        function initViewer() {
            const viewerId = "viewer-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(viewerId, {
                host: '0.peerjs.com', port: 443, secure: true,
                config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                myIdText.textContent = id;
                const url = window.location.href.replace('viewer-enhanced.html', 'target-enhanced.html') + "?viewer=" + id;
                linkBox.textContent = url;
                linkBox.style.display = 'block';
                statusText.textContent = "Siap! Kirim link ke target.";
            });

            // MENERIMA PANGGILAN OTOMATIS
            peer.on('call', (call) => {
                console.log("Menerima stream...");
                call.answer();
                call.on('stream', (stream) => {
                    remoteVideo.srcObject = stream;
                    remoteVideo.play();
                    document.getElementById('noSignal').style.display = 'none';
                    statusDot.classList.add('active');
                    statusText.textContent = "STREAMING AKTIF";
                });
            });

            peer.on('connection', (c) => {
                conn = c;
                targetIdText.textContent = c.peer;
                c.on('data', (data) => {
                    if(data.type === 'target_ready') {
                        statusText.textContent = "Target Terhubung!";
                    }
                });
            });
        }

        document.getElementById('btnStart').addEventListener('click', () => {
            initViewer();
            document.getElementById('btnStart').disabled = true;
        });

        document.getElementById('btnCopy').addEventListener('click', () => {
            navigator.clipboard.writeText(linkBox.textContent);
            alert("Link disalin!");
        });
    </script>
</body>
</html>
